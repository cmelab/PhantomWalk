name: phantomwalk-signac
channels:
  - conda-forge
  - defaults
dependencies:
    # Basic Python dependencies
    # - python>=3.12
    - python>=3.11,<3.14
    - pip
    - jupyterlab

    # Mathematics and scientific computing
    - numpy>=2.0
    - scipy>=1.16.0 # required to allow use of RigidTransform
    - sympy

    # Visualization
    - matplotlib
    - py3Dmol

    # Chemistry
    - rdkit
    - periodictable
    - openbabel>=3

    # Molecular Dynamics toolkits
    ## HOOMD
    - hoomd>=5.0,!=5.3.0
    - gsd>=3.0,<5
    - freud
    - fresnel
    - cmeutils>=1.3
    - grits >=0.6.0
 
    - signac=2.1.0

    - pip:
      - "flowermd @ git+https://github.com/cmelab/flowerMD.git" # experimental DPD functionality not yet in FlowerMD conda releases
      - "gmso @ git+https://github.com/mosdef-hub/gmso.git"
      - "mbuild @ git+https://github.com/mosdef-hub/mbuild.git@develop"
      - "signac-flow @ git+https://github.com/glotzerlab/signac-flow.git@61fe01b" 
